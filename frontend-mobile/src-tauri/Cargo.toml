[package]
name = "tradedojo-mobile"
version = "1.0.0"
description = "K线交易训练 - Tauri 2.0 APK"
authors = ["cttai"]
edition = "2021"
rust-version = "1.77"

# 见 https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "tradedojo_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri 核心(UI 用 core:default 权限已够)
tauri = { version = "2.0", features = [] }

# 官方插件(对齐 https://v2.tauri.app/plugin/)
tauri-plugin-dialog  = "2.0"
tauri-plugin-fs      = "2.0"
tauri-plugin-http    = "2.0"
tauri-plugin-os      = "2.0"
tauri-plugin-shell   = "2.0"
tauri-plugin-store   = "2.0"
tauri-plugin-log     = "2.0"
tauri-plugin-notification = "2.0"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Android 专属插件(用 cfg 守住编译期平台条件)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
