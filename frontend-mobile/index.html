<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📈%3C/text%3E%3C/svg%3E" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="K线训练" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <!--
      CSP:移动端 + Tauri 容器。
      - connect-src 允许 https://api.cttai.art(Tauri 上线环境)
      - Tauri 模式下会通过 capacitor:// / tauri:// / https://tauri.localhost
        加载资源,这里一并放行
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' tauri: capacitor: https://tauri.localhost; script-src 'self' 'unsafe-inline' 'unsafe-eval' tauri:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.cttai.art http://127.0.0.1:8000 ws: wss:; media-src 'self' blob:; base-uri 'self';"
    />
    <title>K线交易训练</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
