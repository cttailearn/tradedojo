[project]
name = "tradedojo"
version = "1.0.0"
description = "TradeDojo · 操盘道场 — A 股数据采集与回测训练系统 (FastAPI + Vue 3)"
readme = "../README.md"
requires-python = ">=3.10"

# 运行时依赖
dependencies = [
    # 数据采集 / 回测
    "akshare>=1.13.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "backtrader>=1.9.78.123",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "schedule>=1.2.0",
    # Web 后端
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "baostock>=0.9.3",
    "tushare>=1.4.29",
    # 数据库驱动: PostgreSQL(可选,配合 STOCK_DB_DRIVER=postgres 使用)
    "psycopg[binary]>=3.1",
    "torch>=2.13.0",
    "einops>=0.8.2",
    "safetensors>=0.8.0",
    "huggingface-hub>=1.24.0",
]

# 暴露 CLI 命令(供 `uv run tradedojo ...` 使用)
[project.scripts]
tradedojo = "cli:main"
tradedojo-web = "main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

# uv 配置
[tool.uv]
package = true

# 测试配置
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
