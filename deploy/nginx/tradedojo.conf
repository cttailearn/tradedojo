# =============================================================================
# TradeDojo Nginx 配置 (v4 - 最小化,稳)
#
# 设计:
#   cttai.art / www.cttai.art → 反代 FastAPI 8000(由 FastAPI 静态服务 SPA + SPA fallback)
#   api.cttai.art             → 反代 FastAPI 8000(API 端口)
#
# 关键:
#   - 两个 server 块都用 proxy_pass 给 FastAPI
#   - 不再 nginx 读 dist,避免权限路径问题
#   - 不再 include options-ssl-nginx.conf(全裸 ssl_protocols)
#   - 证书路径精确按 ls /etc/letsencrypt/live/ 输出
# =============================================================================

# ---- 上游后端 ----
upstream tradedojo_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---- 80 端口:全部 301 到 443(不区分域名)----
server {
    listen 80;
    listen [::]:80;
    server_name cttai.art www.cttai.art api.cttai.art;

    # certbot webroot 校验必须保留
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# 443 - 前端 SPA (cttai.art / www.cttai.art)
#   反代给 FastAPI:由 FastAPI 静态服务 dist + SPA fallback
# ============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cttai.art www.cttai.art;

    ssl_certificate     /etc/letsencrypt/live/www.cttai.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.cttai.art/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/www.cttai.art/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS 全部交给后端 FastAPI CORSMiddleware 处理。
    # nginx 这里绝不写 Access-Control-Allow-* / Allow-Credentials 头,
    # 否则会与 FastAPI 响应头叠加成 "true, true" 这种非法值,被浏览器拒掉。

    # 反代到 FastAPI(它已经把 dist 静态服务)
    location / {
        proxy_pass http://tradedojo_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    client_max_body_size 1m;

    access_log /var/log/nginx/tradedojo.app.access.log;
    error_log  /var/log/nginx/tradedojo.app.error.log;
}

# ============================================================================
# 443 - API (api.cttai.art)
#   反代到 FastAPI 8000
#   根路径显式返回 200 JSON 提示,避免被 FastAPI 当 SPA 路由误打回 index.html
# ============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.cttai.art;

    ssl_certificate     /etc/letsencrypt/live/api.cttai.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cttai.art/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.cttai.art/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS 全部交给后端 FastAPI CORSMiddleware 处理。
    # nginx 这里绝不写 Access-Control-Allow-* / Allow-Credentials 头,
    # 否则会与 FastAPI 响应头叠加成 "true, true" 这种非法值,被浏览器拒掉。
    # 预检 OPTIONS 也直接转发给 FastAPI,让它统一回带正确头与状态码。

    # 根路径明确返回 JSON(避免 FastAPI catch-all 返回 SPA 的 index.html)
    location = / {
        add_header Content-Type application/json always;
        return 200 '{"name":"tradedojo-api","status":"ok","docs":"https://api.cttai.art/api/health"}';
    }

    # 所有请求(含 OPTIONS 预检)都透传给 FastAPI
    location / {
        proxy_pass http://tradedojo_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    client_max_body_size 50m;

    access_log /var/log/nginx/tradedojo.api.access.log;
    error_log  /var/log/nginx/tradedojo.api.error.log;
}
